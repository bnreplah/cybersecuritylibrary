name: Weekly Library Maintenance

# Runs every Sunday at 00:00 UTC.
# Validates all URLs and RSS feeds, flags dead links,
# checks for stale event dates, and triggers a fresh deploy.
# Also runs on manual dispatch.

on:
  schedule:
    - cron: '0 0 * * 0'   # Every Sunday midnight UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (report only, no commits)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  validate-all-urls:
    name: Validate resource URLs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract all URLs from RESOURCES_DB.js
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('RESOURCES_DB.js', 'utf8');
            const db = eval('(' + src.replace(/^var RESOURCES_DB\\s*=/, '').replace(/;\\s*\$/, '') + ')');
            const urls = new Set();
            Object.values(db).forEach(arr => {
              if (!Array.isArray(arr)) return;
              arr.forEach(entry => {
                ['url','site','rss'].forEach(k => { if(entry[k] && /^https?:\/\//.test(entry[k])) urls.add(entry[k]); });
              });
            });
            fs.writeFileSync('all_urls.txt', [...urls].join('\n'));
            console.log('Extracted', urls.size, 'unique URLs');
          "

      - name: Check URL reachability
        id: url_check
        run: |
          dead=0
          total=0
          report=""

          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            total=$((total+1))
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 --connect-timeout 8 \
              -A "Mozilla/5.0 (compatible; cybersecuritylibrary-bot/1.0)" "$url" 2>/dev/null || echo "000")

            if [[ "$code" == "000" ]] || { [[ "$code" =~ ^[45] ]] && [[ "$code" != "403" ]] && [[ "$code" != "429" ]]; }; then
              echo "DEAD [$code]: $url"
              report="${report}\n- \`$url\` → HTTP $code"
              dead=$((dead+1))
            fi
          done < all_urls.txt

          echo "dead=$dead" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT
          printf "DEAD_LINKS<<EOF\n${report}\nEOF" >> $GITHUB_OUTPUT

          echo "### URL Check: $dead/$total dead" >> $GITHUB_STEP_SUMMARY
          if [[ $dead -gt 0 ]]; then
            printf "$report" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Open issue for dead links (if any)
        if: steps.url_check.outputs.dead != '0' && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const dead = ${{ steps.url_check.outputs.dead }};
            const total = ${{ steps.url_check.outputs.total }};
            const body = [
              `## Weekly URL Health Check — ${new Date().toISOString().split('T')[0]}`,
              '',
              `Found **${dead}** potentially dead links out of ${total} checked.`,
              '',
              '### Dead / Unreachable URLs',
              `${{ steps.url_check.outputs.DEAD_LINKS }}`,
              '',
              'Please verify manually and update `RESOURCES_DB.js` accordingly.',
              '_This issue was auto-generated by the weekly maintenance workflow._'
            ].join('\n');

            // Check if a similar open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'dead-link,automated',
              state: 'open'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[AUTO] Dead links detected — ${new Date().toISOString().split('T')[0]}`,
                body,
                labels: ['dead-link', 'automated', 'needs-review']
              });
              console.log('Issue created for dead links.');
            } else {
              console.log('Existing dead-link issue open; skipping duplicate.');
            }

  # ─────────────────────────────────────────────────────────────────
  validate-feeds:
    name: Validate RSS feeds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract feed URLs
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('RESOURCES_DB.js', 'utf8');
            const db = eval('(' + src.replace(/^var RESOURCES_DB\\s*=/, '').replace(/;\\s*\$/, '') + ')');
            const feeds = new Set();
            ['liveFeeds','rssNews','rssVendor','rssIndy'].forEach(k => {
              (db[k] || []).forEach(f => { if(f.url) feeds.add(f.url); if(f.rss) feeds.add(f.rss); });
            });
            fs.writeFileSync('feed_urls.txt', [...feeds].join('\n'));
            console.log('Feeds:', feeds.size);
          "

      - name: Check feeds return valid RSS/Atom
        run: |
          failed=0
          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            code=$(curl -s -o /tmp/fb.xml -w "%{http_code}" -L --max-time 25 \
              -A "Mozilla/5.0 (compatible; cybersecuritylibrary-bot/1.0)" "$url" 2>/dev/null || echo "000")
            if [[ "$code" =~ ^[23] ]]; then
              if head -c 1000 /tmp/fb.xml | grep -qiE '<rss|<feed|<atom|<channel|<\?xml'; then
                echo "OK: $url"
              else
                echo "::warning::NOT-RSS [$code]: $url"
              fi
            else
              echo "::warning::FAIL [$code]: $url"
              failed=$((failed+1))
            fi
          done < feed_urls.txt
          echo "Feed check done. $failed failed."

  # ─────────────────────────────────────────────────────────────────
  check-event-dates:
    name: Flag stale event dates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for past events
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('RESOURCES_DB.js', 'utf8');
            const db = eval('(' + src.replace(/^var RESOURCES_DB\\s*=/, '').replace(/;\\s*\$/, '') + ')');
            const now = new Date();
            const stale = [];
            (db.events || []).forEach(ev => {
              if (!ev.date) return;
              // Look for years in the date string that are in the past
              const m = ev.date.match(/20\d{2}/);
              if (m && parseInt(m[0]) < now.getFullYear()) {
                stale.push(ev.title + ' — ' + ev.date);
              }
            });
            if (stale.length) {
              console.log('::warning::Stale event dates (' + stale.length + '):');
              stale.forEach(s => console.log('  - ' + s));
            } else {
              console.log('All event dates look current.');
            }
          "

  # ─────────────────────────────────────────────────────────────────
  sync-and-deploy:
    name: Re-sync DB and trigger deploy
    runs-on: ubuntu-latest
    needs: [validate-all-urls, validate-feeds, check-event-dates]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync RESOURCES_DB.js into index.html
        run: |
          python3 - <<'PYEOF'
          import re, sys

          with open('RESOURCES_DB.js', 'r') as f:
              db = f.read().rstrip()

          with open('index.html', 'r') as f:
              html = f.read()

          marker_start = '<!-- @@RESOURCES_DB_START@@ -->'
          marker_end   = '<!-- @@RESOURCES_DB_END@@ -->'

          if marker_start not in html or marker_end not in html:
              print('Markers not found — skipping inline sync.')
              sys.exit(0)

          inline_block = (marker_start + '\n<script>\n' + db + '\n</script>\n' + marker_end)
          pattern = re.escape(marker_start) + r'.*?' + re.escape(marker_end)
          new_html = re.sub(pattern, inline_block, html, flags=re.DOTALL)

          if new_html == html:
              print('index.html already in sync.')
          else:
              with open('index.html', 'w') as f:
                  f.write(new_html)
              print('index.html synced.')
          PYEOF

      - name: Update last-checked timestamp in index.html
        if: github.event.inputs.dry_run != 'true'
        run: |
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          sed -i "s|<!-- LAST_WEEKLY_CHECK:[^-]*-->|<!-- LAST_WEEKLY_CHECK:${NOW} -->|g" index.html || true

      - name: Commit if changed
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html RESOURCES_DB.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: weekly maintenance sync $(date -u '+%Y-%m-%d') [skip ci]"
            git push
          fi
